    <meta name="description" content="لعبة أذكار تفاعلية هادئة: فقاعات الأذكار، حديقة الحسنات، ونمط الاستغفار التأملي." />

  </head>
 <body>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // شارة إشعار حمراء بارزة 🔴 فوق أيقونة الإعدادات ⚙️ — تُنشأ فوراً عند توفر تحديث
      function showUpdateBadge() {
        if (document.getElementById('update-badge')) return
        const badge = document.createElement('div')
        badge.id = 'update-badge'
        // موضع زاوية زر الإعدادات (مركز الزر عند 56,62 داخل الـ Canvas بنمط RESIZE = بكسل CSS)
        badge.style.cssText = [
          'position: fixed',
          'left: 76px',
          'top: 16px',
          'z-index: 9998',
          'width: 18px',
          'height: 18px',
          'border-radius: 50%',
          'background: #ef4444',
          'border: 2px solid #ffffff',
          'box-shadow: 0 0 10px rgba(239,68,68,0.8)',
          'pointer-events: none',
          'animation: badge-pulse 0.6s ease-in-out infinite alternate',
        ].join(';')
        const style = document.createElement('style')
        style.textContent =
          '@keyframes badge-pulse { from { transform: scale(1); } to { transform: scale(1.3); } }'
        document.head.appendChild(style)
        document.body.appendChild(badge)
        // إخفاء تلقائي بعد فتح لوحة التحكم (حيث يوجد زر "تحديث النسخة الآن")
        window.addEventListener('open-dashboard', () => badge.remove(), { once: true })
      }
      try {
        if (localStorage.getItem('has_update') === 'true') showUpdateBadge()
      } catch (e) {}

      // على GitHub Pages تُخدم الصفحة من مسار فرعي لكن المسارات هنا نسبية (./sw.js)
      // لذلك يعمل التسجيل بشكل صحيح ويُطلق حدث beforeinstallprompt (نافذة التثبيت).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // هل كانت الصفحة مُتحكَّم بها بـ Service Worker قبل هذه الزيارة؟
          // (false في أول زيارة/أول تثبيت — ولا حاجة لإعادة تحميل حينها)
          const hadController = !!navigator.serviceWorker.controller
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            // فحص فوري للتحديث عند الفتح
            reg.update()

            reg.onupdatefound = () => {
              const installingWorker = reg.installing
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                 // اطلب تفعيل النسخة الجديدة فوراً، مع إبقاء الشارة ظاهرة للمستخدم
                 installingWorker.postMessage({ type: 'SKIP_WAITING' })
                 reg.waiting?.postMessage({ type: 'SKIP_WAITING' })
                 localStorage.setItem('has_update', 'true')
                  showUpdateBadge()
                  if ('setAppBadge' in navigator) navigator.setAppBadge(1).catch(() => {})
                  window.dispatchEvent(new CustomEvent('app-update-available'))
                }
              }
            }
          }).catch(() => {})

          // عند استبدال الـ SW (بعد skipWaiting) أعد تحميل الصفحة تلقائياً
          // ملاحظة: في أول تثبيت يسيطر الـ SW الجديد على الصفحة (clients.claim)
          // بدون وجود متحكّم سابق، وإعادة التحميل حينها لا لزوم لها وتُظهر
          // شاشة فارغة (بيضاء) لحظياً عند بدء التشغيل — لذلك لا نعيد التحميل
          // إلا عند تبديل نسخة SW قائمة بنسخة أحدث (تحديث حقيقي).
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) return
            if (!window.__swReloading) {
              window.__swReloading = true
              window.location.reload()
            }
          })
        })
      }
    </script>
  </body>
</html>
