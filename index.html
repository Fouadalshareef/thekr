 <body>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // على GitHub Pages تُخدم الصفحة من مسار فرعي لكن المسارات هنا نسبية (./sw.js)
      // لذلك يعمل التسجيل بشكل صحيح ويُطلق حدث beforeinstallprompt (نافذة التثبيت).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // هل كانت الصفحة مُتحكَّم بها بـ Service Worker قبل هذه الزيارة؟
          // (false في أول زيارة/أول تثبيت — ولا حاجة لإعادة تحميل حينها)
          const hadController = !!navigator.serviceWorker.controller
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            // فحص فوري للتحديث عند الفتح
            reg.update()

            reg.onupdatefound = () => {
              const installingWorker = reg.installing
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                 // اطلب تفعيل النسخة الجديدة فوراً، مع إبقاء الشارة ظاهرة للمستخدم
                 installingWorker.postMessage({ type: 'SKIP_WAITING' })
                 reg.waiting?.postMessage({ type: 'SKIP_WAITING' })
                 localStorage.setItem('has_update', 'true')
                  if ('setAppBadge' in navigator) navigator.setAppBadge(1).catch(() => {})
                  window.dispatchEvent(new CustomEvent('app-update-available'))
                }
              }
            }
          }).catch(() => {})

          // عند استبدال الـ SW (بعد skipWaiting) أعد تحميل الصفحة تلقائياً
          // ملاحظة: في أول تثبيت يسيطر الـ SW الجديد على الصفحة (clients.claim)
          // بدون وجود متحكّم سابق، وإعادة التحميل حينها لا لزوم لها وتُظهر
          // شاشة فارغة (بيضاء) لحظياً عند بدء التشغيل — لذلك لا نعيد التحميل
          // إلا عند تبديل نسخة SW قائمة بنسخة أحدث (تحديث حقيقي).
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) return
            if (!window.__swReloading) {
              window.__swReloading = true
              window.location.reload()
            }
          })
        })
      }
    </script>
  </body>
