<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>

    <!-- الإطار الذهبي/البرتقالي -->
    <linearGradient id="qg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF8DC"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FB8C00"/>
      <stop offset="0.8" stop-color="#E65100"/>
      <stop offset="1"   stop-color="#BF360C"/>
    </linearGradient>

    <!-- لمعة الإطار العلوية -->
    <linearGradient id="qg-frame-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- الخلفية البرتقالية/البنية (شعاعي) -->
    <radialGradient id="qg-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0"    stop-color="#FFA726"/>
      <stop offset="0.45" stop-color="#D84315"/>
      <stop offset="0.85" stop-color="#8D1500"/>
      <stop offset="1"    stop-color="#5D1A00"/>
    </radialGradient>

    <!-- انعكاس زجاجي علوي -->
    <linearGradient id="qg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- غلاف الكتاب الذهبي -->
    <linearGradient id="qg-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FF8F00"/>
      <stop offset="1"   stop-color="#BF360C"/>
    </linearGradient>

    <!-- صفحات الكتاب -->
    <linearGradient id="qg-pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="1" stop-color="#FFF9C4"/>
    </linearGradient>

    <!-- ظل الزر الخفيف -->
    <filter id="qg-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
        flood-color="#000" flood-opacity="0.30"/>
    </filter>

    <!-- توهج الأيقونة -->
    <filter id="qg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- توهج النجمة -->
    <filter id="qg-star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ظل الأيقونة -->
    <filter id="qg-icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.6" dy="1.5" stdDeviation="1.4"
        flood-color="#1a0500" flood-opacity="0.55"/>
    </filter>

  </defs>

  <!-- ظل خارجي للزر -->
  <rect x="6" y="9" width="88" height="88" rx="25"
    fill="#000" opacity="0.35" filter="url(#qg-drop)"/>

  <!-- الإطار الذهبي (Squircle) -->
  <rect x="2" y="2" width="96" height="96" rx="28"
    fill="url(#qg-frame)"/>

  <!-- لمعة الإطار العلوية -->
  <rect x="4" y="4" width="92" height="40" rx="26"
    fill="url(#qg-frame-shine)" opacity="0.55"/>

  <!-- الخلفية البرتقالية الرئيسية -->
  <rect x="7" y="7" width="86" height="86" rx="22"
    fill="url(#qg-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="7" y="7" width="86" height="45" rx="22"
    fill="url(#qg-lens)"/>

  <!-- حد داخلي خفيف -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="21.5"
    fill="none" stroke="#FFAB40" stroke-width="1"
    opacity="0.4"/>

  <!-- الأيقونة الرئيسية -->
  <g filter="url(#qg-icon-shadow)">
    <g filter="url(#qg-glow)">
      <!-- الغلاف الخلفي -->
      <rect x="18" y="26" width="64" height="50" rx="4" fill="url(#qg-cover)"/>

      <!-- الصفحات الداخلية مكشوفة من الأعلى -->
      <rect x="22" y="24" width="56" height="4" rx="2" fill="#FFF8E1" opacity="0.9"/>

      <!-- صفحة يسار مفتوحة -->
      <path d="M22 28 Q22 26 25 26 L49 26 L49 76 L25 76 C22 76 21 74 21 72 Z"
            fill="url(#qg-pages)"/>
      <!-- خطوط صفحة يسار -->
      <line x1="27" y1="35" x2="46" y2="35" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="42" x2="46" y2="42" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="49" x2="46" y2="49" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="56" x2="46" y2="56" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="63" x2="40" y2="63" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <!-- بريق صفحة يسار -->
      <rect x="22" y="28" width="24" height="5" rx="1" fill="#fff" opacity="0.3"/>

      <!-- صفحة يمين مفتوحة -->
      <path d="M51 26 L75 26 C78 26 79 28 79 30 L79 72 C79 74 78 76 75 76 L51 76 Z"
            fill="url(#qg-pages)"/>
      <!-- خطوط صفحة يمين -->
      <line x1="54" y1="35" x2="73" y2="35" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="54" y1="42" x2="73" y2="42" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="54" y1="49" x2="73" y2="49" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="54" y1="56" x2="73" y2="56" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="54" y1="63" x2="66" y2="63" stroke="#BCAAA4" stroke-width="1.8" stroke-linecap="round"/>
      <!-- بريق صفحة يمين -->
      <rect x="54" y="28" width="24" height="5" rx="1" fill="#fff" opacity="0.3"/>

      <!-- العمود الفقري الذهبي المنتصف -->
      <rect x="47.5" y="24" width="5" height="54" rx="2" fill="url(#qg-cover)"/>
      <rect x="48.5" y="24" width="2" height="54" fill="#FFD54F" opacity="0.7"/>

      <!-- حواف الكتاب -->
      <path d="M22 28 Q22 26 25 26 L49 26 L49 76 L25 76 C22 76 21 74 21 72 Z"
            fill="none" stroke="#BF360C" stroke-width="1.5" opacity="0.6"/>
      <path d="M51 26 L75 26 C78 26 79 28 79 30 L79 72 C79 74 78 76 75 76 L51 76 Z"
            fill="none" stroke="#BF360C" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- نجمة ذهبية متوهجة فوق الكتاب -->
    <g filter="url(#qg-star-glow)">
      <path d="M50 13 L52.5 20 L60 20 L54 24.5 L56.5 31.5 L50 27 L43.5 31.5 L46 24.5 L40 20 L47.5 20Z"
            fill="#FFD600"/>
      <path d="M50 13 L52.5 20 L60 20 L54 24.5 L56.5 31.5 L50 27 L43.5 31.5 L46 24.5 L40 20 L47.5 20Z"
            fill="none" stroke="white" stroke-width="1" opacity="0.7"/>
      <circle cx="50" cy="22" r="3" fill="#fff" opacity="0.5"/>
    </g>
  </g>

  <!-- لمعة خفيفة أعلى الأيقونة -->
  <path d="M28 35 Q50 24 72 35 L70 39 Q50 30 30 39 Z"
    fill="#FFFFFF" opacity="0.20"/>

  <!-- لمعات الزوايا العلوية -->
  <ellipse cx="72" cy="20" rx="10" ry="4"
    fill="#FFFFFF" opacity="0.35"
    transform="rotate(25 72 20)"/>
  <ellipse cx="28" cy="20" rx="8" ry="3"
    fill="#FFFFFF" opacity="0.22"
    transform="rotate(-25 28 20)"/>

</svg>