<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- إطار ذهبي رقيق -->
    <linearGradient id="pp-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF7D6"/>
      <stop offset="0.35" stop-color="#FCD34D"/>
      <stop offset="0.7" stop-color="#D97706"/>
      <stop offset="1"   stop-color="#92400E"/>
    </linearGradient>

    <!-- خلفية برتقالية محمرّة مميزة (تدرج فريد عن باقي الأيقونات) -->
    <radialGradient id="pp-bg" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0"    stop-color="#FDBA74"/>
      <stop offset="0.35" stop-color="#F97316"/>
      <stop offset="0.7" stop-color="#DC2626"/>
      <stop offset="1"    stop-color="#7C2D12"/>
    </radialGradient>

    <!-- لمعة زجاجية علوية ناعمة -->
    <linearGradient id="pp-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- الإطار الذهبي الرقيق -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#pp-frame)"/>

  <!-- الخلفية البرتقالية المحمرّة -->
  <rect x="7" y="7" width="86" height="86" rx="22" fill="url(#pp-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="7" y="7" width="86" height="44" rx="22" fill="url(#pp-lens)"/>

  <!-- خطّا الإيقاف: أبيض ناصع مسطّح بتدوير خفيف -->
  <rect x="28" y="28" width="17" height="44" rx="3" fill="#FFFFFF"/>
  <rect x="55" y="28" width="17" height="44" rx="3" fill="#FFFFFF"/>
</svg>
