<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>

    <!-- الإطار الذهبي/البرتقالي -->
    <linearGradient id="tg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF8DC"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FB8C00"/>
      <stop offset="0.8" stop-color="#E65100"/>
      <stop offset="1"   stop-color="#BF360C"/>
    </linearGradient>

    <!-- لمعة الإطار العلوية -->
    <linearGradient id="tg-frame-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- الخلفية البنفسجية (شعاعي) -->
    <radialGradient id="tg-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0"    stop-color="#CE93D8"/>
      <stop offset="0.45" stop-color="#7B1FA2"/>
      <stop offset="0.85" stop-color="#4A0072"/>
      <stop offset="1"    stop-color="#2D004F"/>
    </radialGradient>

    <!-- انعكاس زجاجي علوي -->
    <linearGradient id="tg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- لوحة الألوان -->
    <radialGradient id="tg-palette-shine" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="1" stop-color="#FFF9C4"/>
    </radialGradient>

    <!-- ظل الزر (خفيف بدون ثقل) -->
    <filter id="tg-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
        flood-color="#000" flood-opacity="0.30"/>
    </filter>

    <!-- توهج الأيقونة -->
    <filter id="tg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- توهج النقاط -->
    <filter id="tg-dot-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ظل الأيقونة -->
    <filter id="tg-icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.2"
        flood-color="#1a0030" flood-opacity="0.55"/>
    </filter>

  </defs>

  <!-- ظل خارجي للزر -->
  <rect x="6" y="9" width="88" height="88" rx="25"
    fill="#000" opacity="0.35" filter="url(#tg-drop)"/>

  <!-- الإطار الذهبي (Squircle) -->
  <rect x="2" y="2" width="96" height="96" rx="28"
    fill="url(#tg-frame)"/>

  <!-- لمعة الإطار العلوية -->
  <rect x="4" y="4" width="92" height="40" rx="26"
    fill="url(#tg-frame-shine)" opacity="0.55"/>

  <!-- الخلفية البنفسجية الرئيسية -->
  <rect x="7" y="7" width="86" height="86" rx="22"
    fill="url(#tg-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="7" y="7" width="86" height="45" rx="22"
    fill="url(#tg-lens)"/>

  <!-- حد داخلي خفيف -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="21.5"
    fill="none" stroke="#CE93D8" stroke-width="1"
    opacity="0.4"/>

  <!-- الأيقونة الرئيسية -->
  <g filter="url(#tg-icon-shadow)">
    <g filter="url(#tg-glow)">
      <!-- لوحة الألوان البيضاء الرئيسية -->
      <path d="M50 25 C32 25 20 37 20 52 c0 10 6 17 16 17 4 0 7-3 7-7 0-2-1-3.5 0-5.5 1.2-2.5 4-3 6-3 h6 c9 0 15-7 15-14 C70 27 61 25 50 25Z"
            fill="url(#tg-palette-shine)"/>
      <!-- حد اللوحة -->
      <path d="M50 25 C32 25 20 37 20 52 c0 10 6 17 16 17 4 0 7-3 7-7 0-2-1-3.5 0-5.5 1.2-2.5 4-3 6-3 h6 c9 0 15-7 15-14 C70 27 61 25 50 25Z"
            fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- نقاط الألوان كبيرة ومتوهجة -->
    <g filter="url(#tg-dot-glow)">
      <!-- أحمر -->
      <circle cx="35" cy="38" r="7" fill="#F44336"/>
      <circle cx="35" cy="38" r="7" fill="none" stroke="white" stroke-width="1.5"/>
      <circle cx="32.5" cy="35.5" r="2.5" fill="white" opacity="0.6"/>

      <!-- أصفر -->
      <circle cx="51" cy="31" r="7" fill="#FFEB3B"/>
      <circle cx="51" cy="31" r="7" fill="none" stroke="white" stroke-width="1.5"/>
      <circle cx="48.5" cy="28.5" r="2.5" fill="white" opacity="0.6"/>

      <!-- أزرق -->
      <circle cx="66" cy="37" r="7" fill="#2196F3"/>
      <circle cx="66" cy="37" r="7" fill="none" stroke="white" stroke-width="1.5"/>
      <circle cx="63.5" cy="34.5" r="2.5" fill="white" opacity="0.6"/>

      <!-- أخضر -->
      <circle cx="33" cy="55" r="7" fill="#4CAF50"/>
      <circle cx="33" cy="55" r="7" fill="none" stroke="white" stroke-width="1.5"/>
      <circle cx="30.5" cy="52.5" r="2.5" fill="white" opacity="0.6"/>
    </g>

    <!-- فرشاة الرسم -->
    <g transform="translate(62,57) rotate(-50)">
      <!-- مقبض الفرشاة -->
      <rect x="-3.5" y="-22" width="7" height="24" rx="3" fill="#8D6E63"/>
      <rect x="-3.5" y="-22" width="7" height="10" rx="2" fill="#A1887F"/>
      <!-- حلقة فضية -->
      <rect x="-3.5" y="2" width="7" height="5" rx="1" fill="#9E9E9E"/>
      <rect x="-3" y="2.5" width="6" height="2" fill="#E0E0E0"/>
      <!-- شعيرات الفرشاة -->
      <ellipse cx="0" cy="11" rx="4" ry="6" fill="#7E57C2"/>
      <ellipse cx="0" cy="11" rx="4" ry="6" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
      <ellipse cx="-1" cy="9" rx="1.5" ry="2.5" fill="white" opacity="0.4"/>
    </g>
  </g>

  <!-- لمعة خفيفة أعلى الأيقونة -->
  <path d="M28 35 Q50 24 72 35 L70 39 Q50 30 30 39 Z"
    fill="#FFFFFF" opacity="0.20"/>

  <!-- لمعات الزوايا العلوية -->
  <ellipse cx="72" cy="20" rx="10" ry="4"
    fill="#FFFFFF" opacity="0.35"
    transform="rotate(25 72 20)"/>
  <ellipse cx="28" cy="20" rx="8" ry="3"
    fill="#FFFFFF" opacity="0.22"
    transform="rotate(-25 28 20)"/>

</svg>