<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.25" stop-color="#FFD600"/>
      <stop offset="0.6" stop-color="#FF8F00"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#CE93D8"/>
      <stop offset="0.5" stop-color="#7B1FA2"/>
      <stop offset="1" stop-color="#2D004F"/>
    </linearGradient>
    <radialGradient id="tg-lens" cx="0.35" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- لوحة الألوان -->
    <radialGradient id="tg-palette-shine" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="1" stop-color="#FFF9C4"/>
    </radialGradient>
    <filter id="tg-drop">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="tg-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg-dot-glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ظل -->
  <rect x="6" y="9" width="88" height="88" rx="23" fill="#000" opacity="0.45" filter="url(#tg-drop)"/>
  <!-- إطار ذهبي -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#tg-frame)"/>
  <rect x="3" y="3" width="94" height="30" rx="25" fill="#fff" opacity="0.25"/>
  <!-- خلفية بنفسجية -->
  <rect x="7" y="7" width="86" height="86" rx="22" fill="url(#tg-bg)"/>
  <rect x="7" y="7" width="86" height="86" rx="22" fill="url(#tg-lens)"/>
  <rect x="7.5" y="7.5" width="85" height="85" rx="21.5" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.6"/>

  <g filter="url(#tg-glow)">
    <!-- ظل اللوحة -->
    <path d="M50 25 C32 25 20 37 20 52 c0 10 6 17 16 17 4 0 7-3 7-7 0-2-1-3.5 0-5.5 1.2-2.5 4-3 6-3 h6 c9 0 15-7 15-14 C70 27 61 25 50 25Z"
          fill="#1a0030" opacity="0.5" transform="translate(2,4)"/>
    <!-- لوحة الألوان البيضاء الرئيسية -->
    <path d="M50 25 C32 25 20 37 20 52 c0 10 6 17 16 17 4 0 7-3 7-7 0-2-1-3.5 0-5.5 1.2-2.5 4-3 6-3 h6 c9 0 15-7 15-14 C70 27 61 25 50 25Z"
          fill="url(#tg-palette-shine)"/>
    <!-- حد اللوحة -->
    <path d="M50 25 C32 25 20 37 20 52 c0 10 6 17 16 17 4 0 7-3 7-7 0-2-1-3.5 0-5.5 1.2-2.5 4-3 6-3 h6 c9 0 15-7 15-14 C70 27 61 25 50 25Z"
          fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- نقاط الألوان كبيرة ومتوهجة -->
  <g filter="url(#tg-dot-glow)">
    <!-- أحمر -->
    <circle cx="35" cy="38" r="7" fill="#F44336"/>
    <circle cx="35" cy="38" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="32.5" cy="35.5" r="2.5" fill="white" opacity="0.6"/>

    <!-- أصفر -->
    <circle cx="51" cy="31" r="7" fill="#FFEB3B"/>
    <circle cx="51" cy="31" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="48.5" cy="28.5" r="2.5" fill="white" opacity="0.6"/>

    <!-- أزرق -->
    <circle cx="66" cy="37" r="7" fill="#2196F3"/>
    <circle cx="66" cy="37" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="63.5" cy="34.5" r="2.5" fill="white" opacity="0.6"/>

    <!-- أخضر -->
    <circle cx="33" cy="55" r="7" fill="#4CAF50"/>
    <circle cx="33" cy="55" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="30.5" cy="52.5" r="2.5" fill="white" opacity="0.6"/>
  </g>

  <!-- فرشاة الرسم -->
  <g transform="translate(62,57) rotate(-50)">
    <!-- مقبض الفرشاة -->
    <rect x="-3.5" y="-22" width="7" height="24" rx="3" fill="#8D6E63"/>
    <rect x="-3.5" y="-22" width="7" height="10" rx="2" fill="#A1887F"/>
    <!-- حلقة فضية -->
    <rect x="-3.5" y="2" width="7" height="5" rx="1" fill="#9E9E9E"/>
    <rect x="-3" y="2.5" width="6" height="2" fill="#E0E0E0"/>
    <!-- شعيرات الفرشاة -->
    <ellipse cx="0" cy="11" rx="4" ry="6" fill="#7E57C2"/>
    <ellipse cx="0" cy="11" rx="4" ry="6" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="-1" cy="9" rx="1.5" ry="2.5" fill="white" opacity="0.4"/>
  </g>

  <ellipse cx="76" cy="18" rx="8" ry="4" fill="#fff" opacity="0.3" transform="rotate(30 76 18)"/>
  <ellipse cx="24" cy="18" rx="8" ry="4" fill="#fff" opacity="0.25" transform="rotate(-30 24 18)"/>
</svg>