<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>

    <!-- الإطار الذهبي/البرتقالي -->
    <linearGradient id="fg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF8DC"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FB8C00"/>
      <stop offset="0.8" stop-color="#E65100"/>
      <stop offset="1"   stop-color="#BF360C"/>
    </linearGradient>

    <!-- لمعة الإطار العلوية -->
    <linearGradient id="fg-frame-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- الخلفية الخضراء (شعاعي) -->
    <radialGradient id="fg-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0"    stop-color="#A5D6A7"/>
      <stop offset="0.45" stop-color="#2E7D32"/>
      <stop offset="0.85" stop-color="#1B5E20"/>
      <stop offset="1"    stop-color="#0A2A0A"/>
    </radialGradient>

    <!-- انعكاس زجاجي علوي -->
    <linearGradient id="fg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- تربة -->
    <linearGradient id="fg-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D6E63"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>

    <!-- عشب -->
    <linearGradient id="fg-grass-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66BB6A"/>
      <stop offset="1" stop-color="#388E3C"/>
    </linearGradient>

    <!-- ظل الزر الخفيف -->
    <filter id="fg-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
        flood-color="#000" flood-opacity="0.30"/>
    </filter>

    <!-- توهج الأيقونة -->
    <filter id="fg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ظل الأيقونة -->
    <filter id="fg-icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.6" dy="1.5" stdDeviation="1.4"
        flood-color="#001a00" flood-opacity="0.55"/>
    </filter>

  </defs>

  <!-- ظل خارجي للزر -->
  <rect x="6" y="9" width="88" height="88" rx="25"
    fill="#000" opacity="0.35" filter="url(#fg-drop)"/>

  <!-- الإطار الذهبي (Squircle) -->
  <rect x="2" y="2" width="96" height="96" rx="28"
    fill="url(#fg-frame)"/>

  <!-- لمعة الإطار العلوية -->
  <rect x="4" y="4" width="92" height="40" rx="26"
    fill="url(#fg-frame-shine)" opacity="0.55"/>

  <!-- الخلفية الخضراء الرئيسية -->
  <rect x="7" y="7" width="86" height="86" rx="22"
    fill="url(#fg-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="7" y="7" width="86" height="45" rx="22"
    fill="url(#fg-lens)"/>

  <!-- حد داخلي خفيف -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="21.5"
    fill="none" stroke="#81C784" stroke-width="1"
    opacity="0.4"/>

  <!-- الأيقونة الرئيسية -->
  <g filter="url(#fg-icon-shadow)">
    <g filter="url(#fg-glow)">
      <!-- تربة -->
      <path d="M20 75 Q50 69 80 75 L80 84 Q50 82 20 84Z" fill="url(#fg-soil)"/>
      <!-- عشب فوق التربة -->
      <path d="M19 75 Q50 68 81 75" fill="none" stroke="#81C784" stroke-width="3.5" stroke-linecap="round"/>

      <!-- شجرة رئيسية: ساق -->
      <rect x="46" y="56" width="8" height="20" rx="3" fill="#6D4C41"/>
      <rect x="47" y="56" width="3" height="20" rx="2" fill="#8D6E63"/>

      <!-- تاج الشجرة - ثلاث طبقات -->
      <!-- طبقة خلفية (أكبر وأغمق) -->
      <ellipse cx="50" cy="48" rx="22" ry="17" fill="#1B5E20" opacity="0.7"/>
      <!-- طبقة وسطى -->
      <ellipse cx="50" cy="44" rx="20" ry="16" fill="#2E7D32"/>
      <!-- طبقة أمامية (أفتح) -->
      <ellipse cx="50" cy="40" rx="17" ry="14" fill="#43A047"/>
      <!-- بريق التاج -->
      <ellipse cx="44" cy="32" rx="8" ry="6" fill="#81C784" opacity="0.5"/>

      <!-- ثمار حمراء مضيئة -->
      <circle cx="37" cy="38" r="5" fill="#F44336"/>
      <circle cx="37" cy="38" r="5" fill="none" stroke="#FFCDD2" stroke-width="1"/>
      <circle cx="35.5" cy="36.5" r="1.8" fill="#FFCDD2" opacity="0.7"/>

      <circle cx="62" cy="35" r="5" fill="#F44336"/>
      <circle cx="62" cy="35" r="5" fill="none" stroke="#FFCDD2" stroke-width="1"/>
      <circle cx="60.5" cy="33.5" r="1.8" fill="#FFCDD2" opacity="0.7"/>

      <circle cx="50" cy="30" r="5" fill="#FF8F00"/>
      <circle cx="50" cy="30" r="5" fill="none" stroke="#FFE0B2" stroke-width="1"/>
      <circle cx="48.5" cy="28.5" r="1.8" fill="#FFE0B2" opacity="0.7"/>

      <!-- عشب أمامي -->
      <path d="M23 75 Q21 67 23 63 Q25 67 27 75Z" fill="#66BB6A"/>
      <path d="M32 74 Q30 66 32 62 Q34 66 36 74Z" fill="#81C784"/>
      <path d="M64 74 Q66 66 64 62 Q62 66 60 74Z" fill="#66BB6A"/>
      <path d="M72 75 Q74 67 72 63 Q70 67 68 75Z" fill="#81C784"/>
      <path d="M50 72 Q48 65 50 61 Q52 65 54 72Z" fill="#A5D6A7"/>
    </g>
  </g>

  <!-- لمعة خفيفة أعلى الأيقونة -->
  <path d="M28 35 Q50 24 72 35 L70 39 Q50 30 30 39 Z"
    fill="#FFFFFF" opacity="0.20"/>

  <!-- لمعات الزوايا العلوية -->
  <ellipse cx="72" cy="20" rx="10" ry="4"
    fill="#FFFFFF" opacity="0.35"
    transform="rotate(25 72 20)"/>
  <ellipse cx="28" cy="20" rx="8" ry="3"
    fill="#FFFFFF" opacity="0.22"
    transform="rotate(-25 28 20)"/>

</svg>