<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.25" stop-color="#FFD600"/>
      <stop offset="0.6" stop-color="#FF8F00"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#B39DDB"/>
      <stop offset="0.5" stop-color="#6A1B9A"/>
      <stop offset="1" stop-color="#1A0033"/>
    </linearGradient>
    <radialGradient id="pg-lens" cx="0.35" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- تدرج العمودين -->
    <linearGradient id="pg-bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E5F5"/>
      <stop offset="0.4" stop-color="#E1BEE7"/>
      <stop offset="1" stop-color="#CE93D8"/>
    </linearGradient>
    <filter id="pg-drop">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="pg-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ظل -->
  <rect x="6" y="9" width="88" height="88" rx="23" fill="#000" opacity="0.45" filter="url(#pg-drop)"/>
  <!-- إطار ذهبي -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#pg-frame)"/>
  <rect x="3" y="3" width="94" height="30" rx="25" fill="#fff" opacity="0.25"/>
  <rect x="2" y="72" width="96" height="26" rx="20" fill="#000" opacity="0.25"/>
  <!-- خلفية -->
  <rect x="9" y="9" width="82" height="82" rx="20" fill="url(#pg-bg)"/>
  <rect x="9" y="9" width="82" height="82" rx="20" fill="url(#pg-lens)"/>
  <rect x="9" y="9" width="82" height="82" rx="20" fill="none" stroke="#CE93D8" stroke-width="2" opacity="0.6"/>

  <g filter="url(#pg-glow)">
    <!-- ظل عمود أيسر -->
    <rect x="26" y="27" width="18" height="46" rx="8" fill="#0D0020" opacity="0.6" transform="translate(2,4)"/>
    <!-- عمود أيسر -->
    <rect x="26" y="27" width="18" height="46" rx="8" fill="url(#pg-bar1)"/>
    <!-- حد عمود أيسر -->
    <rect x="26" y="27" width="18" height="46" rx="8" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- بريق عمود أيسر -->
    <rect x="29" y="30" width="6" height="14" rx="3" fill="white" opacity="0.5"/>

    <!-- ظل عمود أيمن -->
    <rect x="56" y="27" width="18" height="46" rx="8" fill="#0D0020" opacity="0.6" transform="translate(2,4)"/>
    <!-- عمود أيمن -->
    <rect x="56" y="27" width="18" height="46" rx="8" fill="url(#pg-bar1)"/>
    <!-- حد عمود أيمن -->
    <rect x="56" y="27" width="18" height="46" rx="8" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- بريق عمود أيمن -->
    <rect x="59" y="30" width="6" height="14" rx="3" fill="white" opacity="0.5"/>
  </g>

  <ellipse cx="76" cy="18" rx="8" ry="4" fill="#fff" opacity="0.3" transform="rotate(30 76 18)"/>
  <ellipse cx="24" cy="18" rx="8" ry="4" fill="#fff" opacity="0.25" transform="rotate(-30 24 18)"/>
</svg>