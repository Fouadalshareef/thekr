<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>

    <!-- الإطار الذهبي/البرتقالي -->
    <linearGradient id="plg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFF8DC"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FB8C00"/>
      <stop offset="0.8" stop-color="#E65100"/>
      <stop offset="1"   stop-color="#BF360C"/>
    </linearGradient>

    <!-- لمعة الإطار العلوية -->
    <linearGradient id="plg-frame-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- الخلفية الخضراء (شعاعي) -->
    <radialGradient id="plg-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0"    stop-color="#A5D6A7"/>
      <stop offset="0.45" stop-color="#388E3C"/>
      <stop offset="0.85" stop-color="#1B5E20"/>
      <stop offset="1"    stop-color="#0A2A0A"/>
    </radialGradient>

    <!-- انعكاس زجاجي علوي -->
    <linearGradient id="plg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- تدرج المثلث -->
    <linearGradient id="plg-tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#F1F8E9"/>
      <stop offset="0.5" stop-color="#C8E6C9"/>
      <stop offset="1"   stop-color="#81C784"/>
    </linearGradient>

    <!-- ظل الزر الخفيف -->
    <filter id="plg-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
        flood-color="#000" flood-opacity="0.30"/>
    </filter>

    <!-- توهج الأيقونة -->
    <filter id="plg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ظل الأيقونة -->
    <filter id="plg-icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.6" dy="1.5" stdDeviation="1.4"
        flood-color="#0A1F0A" flood-opacity="0.55"/>
    </filter>

  </defs>

  <!-- ظل خارجي للزر -->
  <rect x="6" y="9" width="88" height="88" rx="25"
    fill="#000" opacity="0.35" filter="url(#plg-drop)"/>

  <!-- الإطار الذهبي (Squircle) -->
  <rect x="2" y="2" width="96" height="96" rx="28"
    fill="url(#plg-frame)"/>

  <!-- لمعة الإطار العلوية -->
  <rect x="4" y="4" width="92" height="40" rx="26"
    fill="url(#plg-frame-shine)" opacity="0.55"/>

  <!-- الخلفية الخضراء الرئيسية -->
  <rect x="7" y="7" width="86" height="86" rx="22"
    fill="url(#plg-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="7" y="7" width="86" height="45" rx="22"
    fill="url(#plg-lens)"/>

  <!-- حد داخلي خفيف -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="21.5"
    fill="none" stroke="#81C784" stroke-width="1"
    opacity="0.4"/>

  <!-- مثلث التشغيل -->
  <g filter="url(#plg-icon-shadow)">
    <g filter="url(#plg-glow)">
      <!-- المثلث الرئيسي -->
      <path d="M30 24 L78 50 L30 76Z" fill="url(#plg-tri)"/>
      <!-- حد المثلث -->
      <path d="M30 24 L78 50 L30 76Z" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
      <!-- بريق علوي للمثلث -->
      <path d="M32 27 L60 42 L32 42Z" fill="white" opacity="0.25"/>
    </g>
  </g>

  <!-- لمعة خفيفة أعلى الأيقونة -->
  <path d="M28 35 Q50 24 72 35 L70 39 Q50 30 30 39 Z"
    fill="#FFFFFF" opacity="0.20"/>

  <!-- لمعات الزوايا العلوية -->
  <ellipse cx="72" cy="20" rx="10" ry="4"
    fill="#FFFFFF" opacity="0.35"
    transform="rotate(25 72 20)"/>
  <ellipse cx="28" cy="20" rx="8" ry="3"
    fill="#FFFFFF" opacity="0.22"
    transform="rotate(-25 28 20)"/>

</svg>