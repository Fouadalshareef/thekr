<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <defs>

    <!-- الإطار الذهبي/البرتقالي -->
    <linearGradient id="sg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.5" stop-color="#FB8C00"/>
      <stop offset="0.8" stop-color="#E65100"/>
      <stop offset="1" stop-color="#BF360C"/>
    </linearGradient>

    <!-- لمعة الإطار العلوية -->
    <linearGradient id="sg-frame-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- الخلفية الزرقاء (شعاعي) -->
    <radialGradient id="sg-bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="0.45" stop-color="#1976D2"/>
      <stop offset="0.85" stop-color="#0D47A1"/>
      <stop offset="1" stop-color="#062578"/>
    </radialGradient>

    <!-- انعكاس زجاجي علوي -->
    <linearGradient id="sg-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- تدرج الترس الأبيض -->
    <linearGradient id="sg-gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#D6E4F0"/>
    </linearGradient>

    <!-- ظل الزر -->
    <filter id="sg-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4"
        flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- ظل الترس -->
    <filter id="sg-gear-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.6" dy="1.5" stdDeviation="1.4"
        flood-color="#001233" flood-opacity="0.55"/>
    </filter>

  </defs>


  <!-- ظل خارجي للزر -->
  <rect x="6" y="9" width="88" height="88" rx="25"
    fill="#000" opacity="0.45" filter="url(#sg-drop)"/>


  <!-- الإطار الذهبي (Squircle) -->
  <rect x="2" y="2" width="96" height="96" rx="28"
    fill="url(#sg-frame)"/>

  <!-- لمعة الإطار العلوية -->
  <rect x="4" y="4" width="92" height="40" rx="26"
    fill="url(#sg-frame-shine)" opacity="0.55"/>

  <!-- عمق سفلي للإطار -->
  <rect x="2" y="70" width="96" height="28" rx="24"
    fill="#000" opacity="0.22"/>


  <!-- الخلفية الزرقاء الرئيسية -->
  <rect x="9" y="9" width="82" height="82" rx="22"
    fill="url(#sg-bg)"/>

  <!-- الانعكاس الزجاجي العلوي -->
  <rect x="9" y="9" width="82" height="45" rx="22"
    fill="url(#sg-lens)"/>

  <!-- حد داخلي خفيف -->
  <rect x="9.5" y="9.5" width="81" height="81" rx="21.5"
    fill="none" stroke="#90CAF9" stroke-width="1"
    opacity="0.4"/>


  <!-- الترس (8 أسنان مستطيلة مسطحة) -->
  <g filter="url(#sg-gear-shadow)">

    <!-- الترس الأبيض بأسنان مستطيلة -->
    <path
      d="
        M 45.5 22
        L 54.5 22
        L 55.8 30.5
        L 61.3 32.8
        L 67.7 26.9
        L 74.1 33.3
        L 68.2 39.7
        L 70.5 45.2
        L 79 46.5
        L 79 55.5
        L 70.5 56.8
        L 68.2 62.3
        L 74.1 68.7
        L 67.7 75.1
        L 61.3 69.2
        L 55.8 71.5
        L 54.5 80
        L 45.5 80
        L 44.2 71.5
        L 38.7 69.2
        L 32.3 75.1
        L 25.9 68.7
        L 31.8 62.3
        L 29.5 56.8
        L 21 55.5
        L 21 46.5
        L 29.5 45.2
        L 31.8 39.7
        L 25.9 33.3
        L 32.3 26.9
        L 38.7 32.8
        L 44.2 30.5
        Z
      "
      fill="url(#sg-gear)"
      stroke="#FFFFFF"
      stroke-width="0.4"
      stroke-linejoin="round"/>

    <!-- الفتحة المركزية المفرغة (تُظهر الخلفية الزرقاء) -->
    <circle cx="50" cy="50" r="10.5"
      fill="url(#sg-bg)"/>

    <!-- حد داخلي ناعم حول الفتحة -->
    <circle cx="50" cy="50" r="10.5"
      fill="none" stroke="#B0BEC5"
      stroke-width="0.5" opacity="0.6"/>

  </g>

  <!-- لمعة خفيفة أعلى الترس -->
  <path
    d="
      M 30 40
      Q 50 30 70 40
      L 68 44
      Q 50 36 32 44
      Z
    "
    fill="#FFFFFF"
    opacity="0.25"/>


  <!-- لمعات الزوايا العلوية -->
  <ellipse cx="72" cy="20" rx="10" ry="4"
    fill="#FFFFFF" opacity="0.35"
    transform="rotate(25 72 20)"/>

  <ellipse cx="28" cy="20" rx="8" ry="3"
    fill="#FFFFFF" opacity="0.22"
    transform="rotate(-25 28 20)"/>

</svg>